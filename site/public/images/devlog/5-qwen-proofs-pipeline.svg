<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t d">
  <title id="t">How AIs@home proves a prove2me lemma</title>
  <desc id="d">Top: volunteer GPU nodes running Qwen3.8 27B talk to the gateway, the gateway talks to runners (CPU spot machines with the agent and a Lean sandbox), and runners submit to prove2me. Bottom: the model writes an outline, each hole becomes its own task, the pieces are assembled, checked by Lean, and submitted to prove2me, which checks again. A failed step sends the lemma back to a new outline.</desc>
  <style>
    .card { fill: #fbf1e4; stroke: #c8641e; stroke-width: 1.5; }
    .gpu { fill: #fde3c8; }
    .h { fill: #2b1d12; font: 700 14px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .s { fill: #5a4636; font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .label { fill: #c8641e; font: 700 13px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 0.04em; }
    .note { fill: #8a7766; font: italic 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .line { stroke: #9a8a7c; stroke-width: 2; fill: none; }
    .head { fill: #9a8a7c; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #2a211a; stroke: #ff9842; }
      .gpu { fill: #3a2a1c; }
      .h { fill: #f6ede1; }
      .s { fill: #cdbba8; }
      .label { fill: #ff9842; }
      .note { fill: #b8a594; }
      .line { stroke: #a8978a; }
      .head { fill: #a8978a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- Where it runs -->
  <text class="label" x="10" y="22">WHERE IT RUNS</text>

  <rect class="card gpu" x="10" y="36" width="190" height="100" rx="10"/>
  <text class="h" x="105" y="62" text-anchor="middle">Volunteer GPU nodes</text>
  <text class="s" x="105" y="84" text-anchor="middle">Qwen3.8 27B on llama.cpp</text>
  <text class="s" x="105" y="102" text-anchor="middle">RTX 3090 / 4090 (24 GB),</text>
  <text class="s" x="105" y="120" text-anchor="middle">16 GB cards too</text>

  <rect class="card" x="230" y="36" width="130" height="100" rx="10"/>
  <text class="h" x="295" y="62" text-anchor="middle">Gateway</text>
  <text class="s" x="295" y="84" text-anchor="middle">task queue</text>
  <text class="s" x="295" y="102" text-anchor="middle">model requests</text>
  <text class="s" x="295" y="120" text-anchor="middle">to the nodes</text>

  <rect class="card" x="390" y="36" width="210" height="100" rx="10"/>
  <text class="h" x="495" y="62" text-anchor="middle">Runners</text>
  <text class="s" x="495" y="84" text-anchor="middle">CPU spot machines, 8 GB</text>
  <text class="s" x="495" y="102" text-anchor="middle">opencode agent in a sandbox</text>
  <text class="s" x="495" y="120" text-anchor="middle">with Lean 4 and Mathlib</text>

  <rect class="card" x="630" y="36" width="140" height="100" rx="10"/>
  <text class="h" x="700" y="62" text-anchor="middle">prove2me</text>
  <text class="s" x="700" y="84" text-anchor="middle">checks every</text>
  <text class="s" x="700" y="102" text-anchor="middle">proof with Lean</text>
  <text class="s" x="700" y="120" text-anchor="middle">itself</text>

  <line class="line" x1="204" y1="86" x2="226" y2="86" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="364" y1="86" x2="386" y2="86" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="line" x1="604" y1="86" x2="626" y2="86" marker-end="url(#a)"/>

  <!-- How a lemma is proved -->
  <text class="label" x="10" y="186">HOW A LEMMA IS PROVED</text>

  <rect class="card" x="10" y="200" width="132" height="84" rx="10"/>
  <text class="h" x="76" y="225" text-anchor="middle">1. Outline</text>
  <text class="s" x="76" y="246" text-anchor="middle">proof split into</text>
  <text class="s" x="76" y="264" text-anchor="middle">steps left as sorry</text>

  <rect class="card" x="169" y="200" width="132" height="84" rx="10"/>
  <text class="h" x="235" y="225" text-anchor="middle">2. Hole tasks</text>
  <text class="s" x="235" y="246" text-anchor="middle">one fresh agent</text>
  <text class="s" x="235" y="264" text-anchor="middle">per hole, any GPU</text>

  <rect class="card" x="328" y="200" width="132" height="84" rx="10"/>
  <text class="h" x="394" y="225" text-anchor="middle">3. Assembly</text>
  <text class="s" x="394" y="246" text-anchor="middle">proved pieces</text>
  <text class="s" x="394" y="264" text-anchor="middle">put together</text>

  <rect class="card" x="487" y="200" width="132" height="84" rx="10"/>
  <text class="h" x="553" y="225" text-anchor="middle">4. Lean check</text>
  <text class="s" x="553" y="246" text-anchor="middle">our own check</text>
  <text class="s" x="553" y="264" text-anchor="middle">on the runner</text>

  <rect class="card" x="646" y="200" width="124" height="84" rx="10"/>
  <text class="h" x="708" y="225" text-anchor="middle">5. Submit</text>
  <text class="s" x="708" y="246" text-anchor="middle">prove2me</text>
  <text class="s" x="708" y="264" text-anchor="middle">checks it again</text>

  <line class="line" x1="144" y1="242" x2="165" y2="242" marker-end="url(#a)"/>
  <line class="line" x1="303" y1="242" x2="324" y2="242" marker-end="url(#a)"/>
  <line class="line" x1="462" y1="242" x2="483" y2="242" marker-end="url(#a)"/>
  <line class="line" x1="621" y1="242" x2="642" y2="242" marker-end="url(#a)"/>

  <!-- failed step loops back to a new outline -->
  <path class="line" d="M235,288 C235,338 76,338 76,292" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text class="note" x="156" y="352" text-anchor="middle">a step fails or is false: new outline</text>

  <text class="note" x="390" y="388" text-anchor="middle">Model calls go runner → gateway → GPU node; Lean runs only on the runners.</text>
</svg>
