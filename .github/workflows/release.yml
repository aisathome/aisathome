# On a v* tag: run the CI checks, build static binaries, llama-server with CUDA, the
# prebuilt node bundle and the Windows installer (also under a name without the version, for a
# stable download link), plus SHA256SUMS, and attach them to a draft GitHub Release (a maintainer
# publishes it after review). A manual run (workflow_dispatch) on a branch is the dry run: it
# builds everything without publishing and keeps the files as a workflow artifact for 7 days
# (for a test install on a rented GPU).
# SPDX-License-Identifier: Apache-2.0
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cuda_archs:
        description: "CUDA architectures for llama-server (one, e.g. 86-real, makes a faster dry run)"
        type: string
        default: "86-real;89-real;120a-real"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # llama-server with CUDA, built by scripts/build-llama.sh in NVIDIA's CUDA 12.8 devel image
  # (pinned by digest; Ubuntu 22.04, so the bundle needs glibc 2.35 or newer).
  # Dry runs only: the build takes most of a dry run's time and its inputs rarely change, so a
  # dry run caches its output (llama.tar) under a key made of everything that goes into it: the
  # runner's OS image and architecture, the llama.cpp tag and commit, and a hash of the CUDA
  # image (by digest), the CUDA architectures, the container's build command below and
  # scripts/build-llama.sh (its flags and pins). A change to any of them is a new key, and so a
  # fresh build; only an exact key restores (no restore-keys). The key is computable from the
  # repository and the tar's BUILD-INFO check below cannot tell a forged entry, so a cache is
  # not a trusted source: a tag run (a real release) never restores or saves one and always
  # builds from scratch, like the rest of the release (no shared build cache in release builds).
  llama:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      CUDA_IMAGE: nvidia/cuda:12.8.1-devel-ubuntu22.04@sha256:a99a1860ba8e2916e5c3e73b72ec4c4301653a84586e05bfc9a2aa2d58027e97
      CUDA_ARCHS: ${{ inputs.cuda_archs || '86-real;89-real;120a-real' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Runs as root inside the container; hands the output back to the runner's user.
      BUILD_IN_CONTAINER: |
        apt-get update -qq
        DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
          git ca-certificates cmake ninja-build g++ >/dev/null
        scripts/build-llama.sh /src/llama-out
        chown -R "$HOST_IDS" /src/llama-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache key
        id: key
        run: |
          tag="$(sed -n 's/^LLAMA_TAG=//p' scripts/build-llama.sh)"
          commit="$(sed -n 's/^LLAMA_COMMIT=//p' scripts/build-llama.sh)"
          [[ "$tag" =~ ^b[0-9]+$ && "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "no LLAMA_TAG/LLAMA_COMMIT pin in scripts/build-llama.sh"; exit 1; }
          recipe="$({ printf '%s\n' "$CUDA_IMAGE" "$CUDA_ARCHS" "$BUILD_IN_CONTAINER"; cat scripts/build-llama.sh; } | sha256sum | cut -c1-32)"
          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "key=llama-server-${ImageOS:?}-$RUNNER_ARCH-$tag-$commit-$recipe"
          } >> "$GITHUB_OUTPUT"
      - name: Restore llama-server (exact key only; dry runs only)
        id: cache
        if: env.IS_TAG != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llama.tar
          key: ${{ steps.key.outputs.key }}
      - name: Free disk space (the CUDA image is about 10 GB unpacked)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build llama-server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker pull -q "$CUDA_IMAGE"
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e CUDA_ARCHS -e BUILD_IMAGE="$CUDA_IMAGE" -e JOBS="$(nproc)" -e HOST_IDS="$(id -u):$(id -g)" \
            "$CUDA_IMAGE" bash -euo pipefail -c "$BUILD_IN_CONTAINER"
          # A tar keeps the library symlinks and modes, which artifacts do not.
          tar -C llama-out -cf llama.tar .
      - name: Check the build against the pins
        # A consistency check, not a defence: a cached tar could carry a forged BUILD-INFO.
        env:
          TAG: ${{ steps.key.outputs.tag }}
          COMMIT: ${{ steps.key.outputs.commit }}
          FROM_CACHE: ${{ steps.cache.outputs.cache-hit == 'true' }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          tar -tf llama.tar ./bin/llama-server >/dev/null
          info="$(tar -xOf llama.tar ./BUILD-INFO)"
          want="$(printf '%s\n' "llama_cpp_tag=$TAG" "llama_cpp_commit=$COMMIT" "cuda_archs=$CUDA_ARCHS" "build_image=$CUDA_IMAGE")"
          missing="$(grep -vxF -f <(echo "$info") <<<"$want" || true)"
          if [ -n "$missing" ]; then echo "BUILD-INFO does not match the pins:"; echo "$missing"; echo "$info"; exit 1; fi
          {
            echo '### llama-server'
            if [ "$FROM_CACHE" = true ]; then echo "From the cache (dry run): \`$KEY\`"; elif [ "$IS_TAG" = true ]; then echo "Built from scratch (tag run, no cache)"; else echo "Built, and saved to the cache as \`$KEY\`"; fi
            echo '```'; echo "$info"; tar -tvf llama.tar | grep -E ' \./(bin|lib)/.'; du -h llama.tar; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save llama-server to the cache (dry runs only)
        if: env.IS_TAG != 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llama.tar
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llama
          path: llama.tar
          retention-days: 7
          compression-level: 1
          if-no-files-found: error

  # The Windows installer (node/packaging/windows), built on Windows by Inno Setup 6. Its agent
  # is built as build-release.sh builds aisathome-node-windows-amd64.exe; the release job checks
  # that the two are the same bytes.
  node-setup:
    runs-on: windows-2025
    timeout-minutes: 60 # lzma2 over the engine (about 1.5 GB unpacked) takes a while
    permissions:
      contents: read
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # The agent embeds its page's files: LF as in the repo, or the bytes differ.
      - name: git keeps LF line ends
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no shared build cache in release builds
      # The engine: upstream llama.cpp's Windows CUDA 12.4 release of the commit the Linux
      # bundle builds, pinned by size and SHA-256 (node/setup/llama.go); fetch-llama checks the
      # zips and unpacks them into one folder, which the installer packs as {app}\engine.
      - name: Fetch the engine
        shell: pwsh
        run: |
          go run ./node/packaging/windows/fetch-llama -out (Join-Path $env:RUNNER_TEMP 'engine')
          if ($LASTEXITCODE -ne 0) { throw 'fetch-llama failed' }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'engine\llama\llama-server.exe'))) { throw 'no llama-server.exe' }
      - name: Build the installer
        shell: pwsh
        run: |
          $version = if ($env:IS_TAG -eq 'true') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 12))" }
          ./node/packaging/windows/build-installer.ps1 -Version $version -OutDir win-dist -EngineDir (Join-Path $env:RUNNER_TEMP 'engine\llama')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AIsAtHome-node-setup
          path: win-dist/*.exe # the agent and AIsAtHome-node-setup-<version>.exe
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [check, llama, node-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no shared build cache in release builds
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llama
          path: ${{ runner.temp }}/llama-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AIsAtHome-node-setup
          path: ${{ runner.temp }}/windows
      - name: Build
        run: |
          if [ "$IS_TAG" = true ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::12}"; fi
          mkdir "$RUNNER_TEMP/llama"
          tar -C "$RUNNER_TEMP/llama" -xf "$RUNNER_TEMP/llama-artifact/llama.tar"
          LLAMA_DIR="$RUNNER_TEMP/llama" ./scripts/build-release.sh "$version" dist
          # The installer's agent must be the release's Windows agent, byte for byte.
          cmp "$RUNNER_TEMP/windows/aisathome-node-windows-amd64.exe" dist/aisathome-node-windows-amd64.exe
          cp "$RUNNER_TEMP/windows/AIsAtHome-node-setup-$version.exe" dist/
          # The same installer under a name without the version: releases/latest/download/
          # AIsAtHome-node-setup.exe (the site's download button) then always gets the newest.
          cp "dist/AIsAtHome-node-setup-$version.exe" dist/AIsAtHome-node-setup.exe
          (cd dist && sha256sum aisathome-* AIsAtHome-* > SHA256SUMS)
          ls -l dist
      - name: Publish
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes $pre
      - name: Summary (not published)
        if: env.IS_TAG != 'true'
        run: |
          { echo "Not a v* tag: built, not published. Files: the 'dist' artifact (7 days)."; echo '```'; ls -l dist; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.IS_TAG != 'true'
        with:
          name: dist
          path: dist/
          retention-days: 7
          compression-level: 0 # the bundle is already xz-compressed
          if-no-files-found: error
