# Checks for every push and pull request; release.yml runs the same job before building.
# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: no references to the internal notes
        # The project's research notes are internal: public code and pages cite public sources.
        # Web addresses are removed first (a public page may well live under /research/).
        run: |
          pat='research repo|bench/kvquant|research/[a-z]'
          if git grep -n -i -E "$pat" -- ':!.github' | sed -E 's#[a-z]+://[^ )>"]*##g' | grep -i -E "$pat"; then exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: install.sh tests
        run: ./node/packaging/linux/install_test.sh
      - name: prebuilt bundle packaging (fake llama-server)
        run: ./scripts/bundle_test.sh
      - name: release build, installed from file:// by install.sh
        run: |
          set -o pipefail
          ./scripts/build-release.sh v0.0.0 "$RUNNER_TEMP/rel/download/v0.0.0"
          # The runner has no GPU: a fake nvidia-smi reports one 24 GB card, as in install_test.sh.
          mkdir -p "$RUNNER_TEMP/fake"
          printf '%s\n' '#!/bin/sh' 'case "$*" in *memory.total*) echo "0, GPU-ci-0, NVIDIA GeForce RTX 3090, 24576, 24126" ;; esac' \
            > "$RUNNER_TEMP/fake/nvidia-smi"
          chmod +x "$RUNNER_TEMP/fake/nvidia-smi"
          # --model: a small file pinned as the model (MODEL_URL, MODEL_SHA256 and MODEL_SIZE go
          # together), so the dry run does not depend on the runner's free disk.
          PATH="$RUNNER_TEMP/fake:$PATH" AISATHOME_RELEASE_URL="file://$RUNNER_TEMP/rel" \
            MODEL_URL="file://$PWD/go.mod" MODEL_SHA256="$(sha256sum go.mod | cut -d' ' -f1)" MODEL_SIZE="$(stat -c %s go.mod)" \
            ./node/packaging/linux/install.sh --dry-run --node-release v0.0.0 --model go.mod | tee "$RUNNER_TEMP/dry-run.txt"
          grep -q '^tier: big: 1 x 196608 tokens' "$RUNNER_TEMP/dry-run.txt"

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:22-bookworm-slim
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: build the website (site/)
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build && npm run check
