# Checks for every push and pull request; release.yml runs the same job before building.
# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The release tags: e2e/compat_test.go builds the latest two node releases and runs
          # the basic chat through them (decision 0013); without tags it fails in CI.
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: no references to the internal notes
        # The project's research notes are internal: public code and pages cite public sources.
        # Web addresses are removed first (a public page may well live under /research/).
        run: |
          pat='research repo|bench/kvquant|research/[a-z]'
          if git grep -n -i -E "$pat" -- ':!.github' | sed -E 's#[a-z]+://[^ )>"]*##g' | grep -i -E "$pat"; then exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: install.sh tests
        run: ./node/packaging/linux/install_test.sh
      - name: prebuilt bundle packaging (fake llama-server)
        run: ./scripts/bundle_test.sh
      - name: release build, installed from file:// by install.sh
        run: |
          set -o pipefail
          ./scripts/build-release.sh v0.0.0 "$RUNNER_TEMP/rel/download/v0.0.0"
          # The runner has no GPU: a fake nvidia-smi reports one 24 GB card, as in install_test.sh.
          mkdir -p "$RUNNER_TEMP/fake"
          printf '%s\n' '#!/bin/sh' 'case "$*" in *memory.total*) echo "0, GPU-ci-0, NVIDIA GeForce RTX 3090, 24576, 24126" ;; esac' \
            > "$RUNNER_TEMP/fake/nvidia-smi"
          chmod +x "$RUNNER_TEMP/fake/nvidia-smi"
          # --model: a small file pinned as the model (MODEL_URL, MODEL_SHA256 and MODEL_SIZE go
          # together), so the dry run does not depend on the runner's free disk.
          PATH="$RUNNER_TEMP/fake:$PATH" AISATHOME_RELEASE_URL="file://$RUNNER_TEMP/rel" \
            MODEL_URL="file://$PWD/go.mod" MODEL_SHA256="$(sha256sum go.mod | cut -d' ' -f1)" MODEL_SIZE="$(stat -c %s go.mod)" \
            ./node/packaging/linux/install.sh --dry-run --node-release v0.0.0 --model go.mod | tee "$RUNNER_TEMP/dry-run.txt"
          grep -q '^tier: big: 1 x 196608 tokens' "$RUNNER_TEMP/dry-run.txt"

  windows:
    # The node agent on Windows, without a GPU: vet, build and unit tests of the node packages,
    # then the agent as a real Windows service with its default files under %ProgramData%.
    # There is no engine and no gateway, so the agent runs, serves its local UI and reports
    # "not connected". windows-2025 is windows-latest today, pinned like ubuntu-24.04 above.
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: go vet (node)
        run: go vet ./node/... ./protocol/...
      - name: go build (node)
        run: go build ./node/...
      - name: go test (node)
        # No -race: on Windows it needs cgo and a C toolchain. The check job runs the same
        # tests with it on Linux.
        run: go test -count=1 ./node/... ./protocol/...
      - name: the agent as a Windows service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'svc')
          $bin = Join-Path $dir 'aisathome-node.exe'
          go build -o $bin ./node/cmd/aisathome-node
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          # The default folder (node.WindowsLayout): config, password, state and log.
          $data = Join-Path $env:ProgramData 'AIsAtHome'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content -Encoding ascii (Join-Path $data 'node.json') `
            '{"node_id":"ci-windows","gateway_url":"ws://127.0.0.1:1/v1/node/connect","token":"ci","upstream":"http://127.0.0.1:1","models":[{"name":"ci","slots":1,"ctx":4096}]}'
          Set-Content -Encoding ascii (Join-Path $data 'ui-password') 'ci-password-0123456789'
          # No -config: the service must find its config in the default folder.
          New-Service -Name aisathome-node -BinaryPathName "`"$bin`"" -StartupType Manual | Out-Null
          Start-Service aisathome-node
          $out = ''
          $answered = $false
          for ($i = 0; $i -lt 30 -and -not $answered; $i++) {
            Start-Sleep -Seconds 1
            $out = & $bin status -json | Out-String
            # Exit 1: an agent answered and is not connected (3: nothing answered yet).
            $answered = $LASTEXITCODE -eq 1
          }
          $log = Join-Path $data 'logs\node.log'
          if (-not $answered) {
            if (Test-Path $log) { Get-Content $log }
            throw "the service's agent did not answer on 127.0.0.1:7381 (last exit $LASTEXITCODE)"
          }
          $st = $out | ConvertFrom-Json
          if ($st.node_id -ne 'ci-windows' -or $st.connected -or -not $st.controls.enabled) {
            throw "unexpected status (want ci-windows, not connected, controls on): $out"
          }
          Stop-Service aisathome-node
          $svc = Get-CimInstance Win32_Service -Filter "Name='aisathome-node'"
          if ($svc.State -ne 'Stopped' -or $svc.ExitCode -ne 0) {
            throw "after Stop-Service: state $($svc.State), exit code $($svc.ExitCode)"
          }
          Get-Content $log
          if (-not (Select-String -Quiet -Path $log -Pattern 'msg=starting')) { throw "no start line in $log" }
          if (-not (Test-Path (Join-Path $data 'state.json'))) { throw 'no state file in the default folder' }
          Remove-Service aisathome-node
          exit 0

  harness:
    # harness/ (the Python package aisathome_harness): its offline tests. Standard library only, so the
    # runner's own Python 3.12 (Ubuntu 24.04) runs them; no third-party action, nothing installed.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: harness tests (offline)
        working-directory: harness
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] >= (3, 12), sys.version'
          python3 -m unittest discover -s tests -t . -v

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:22-bookworm-slim
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: build the website (site/)
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build && npm run check
