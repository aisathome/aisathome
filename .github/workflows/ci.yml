# Checks for every push and pull request; release.yml runs the same job before building.
# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: install.sh tests
        run: ./node/packaging/linux/install_test.sh
      - name: prebuilt bundle packaging (fake llama-server)
        run: ./scripts/bundle_test.sh
      - name: release build, installed from file:// by install.sh
        run: |
          ./scripts/build-release.sh v0.0.0 "$RUNNER_TEMP/rel/download/v0.0.0"
          # --model: any existing file, so the dry run does not depend on the runner's free disk.
          AISATHOME_RELEASE_URL="file://$RUNNER_TEMP/rel" \
            ./node/packaging/linux/install.sh --dry-run --node-release v0.0.0 --model go.mod

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: node:22-bookworm-slim
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: build the website (site/)
        working-directory: site
        run: npm ci --no-audit --no-fund && npm run build && npm run check
